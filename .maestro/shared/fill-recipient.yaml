# Vai trò: Điền thông tin người nhận dùng chung cho các kịch bản đặt món.
# Cách hoạt động: Cuộn tới từng ô, nhập dữ liệu mẫu rồi ẩn bàn phím.
appId: com.xoicotam.mobile.e2e
---
# Gọi từ menu trước khi cuộn qua biểu mẫu người nhận.
# Dữ liệu mẫu dùng ký tự ASCII để tương thích với inputText trên iOS.
- scrollUntilVisible:
    element:
      id: "recipient-name"
    direction: DOWN
- tapOn:
    id: "recipient-name"
- inputText: "Maestro Customer"
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
- scrollUntilVisible:
    element:
      id: "recipient-phone"
    direction: DOWN
- tapOn:
    id: "recipient-phone"
- inputText: "0900000099"
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
- scrollUntilVisible:
    element:
      id: "recipient-address"
    direction: DOWN
- tapOn:
    id: "recipient-address"
- inputText: "12 Nguyen Van Cu, TP HCM"
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
- scrollUntilVisible:
    element:
      id: "recipient-note"
    direction: DOWN
- tapOn:
    id: "recipient-note"
- inputText: "Khong hanh"
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
