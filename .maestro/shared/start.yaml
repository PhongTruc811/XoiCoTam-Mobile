# Vai trò: Khởi động ứng dụng ở trạng thái sạch và đi qua bước kiểm tra kết nối.
# Cách hoạt động: Mở lại ứng dụng, xác nhận môi trường E2E rồi chờ màn chọn đối tượng.
appId: com.xoicotam.mobile.e2e
---
# Tiến trình JS mới đặt lại đơn hàng trong bộ nhớ và phiên vai trò.
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: "connection-check"
    direction: DOWN
- assertVisible:
    id: "connection-target"
    text: "E2E.*"
- tapOn:
    id: "connection-check"
# Chờ bước chuyển màn hình kiểm tra kết nối, kể cả thời gian hiển thị của nó.
- extendedWaitUntil:
    visible:
      id: "audience-customer"
    timeout: 20000
