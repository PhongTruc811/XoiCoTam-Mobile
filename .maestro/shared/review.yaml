# Vai trò: Mở màn xem lại đơn để các kịch bản tiếp tục kiểm tra hoặc đặt hàng.
# Cách hoạt động: Cuộn tới nút xem lại, mở màn hình và kiểm tra tên người nhận mẫu.
appId: com.xoicotam.mobile.e2e
---
- scrollUntilVisible:
    element:
      id: "order-review"
    direction: DOWN
- tapOn:
    id: "order-review"
- scrollUntilVisible:
    element:
      id: "review-name"
    direction: DOWN
- assertVisible:
    id: "review-name"
    text: "Maestro Customer"
