# Vai trò: Kiểm tra dữ liệu người nhận còn nguyên khi quay lại từ màn xem đơn.
# Cách hoạt động: Điền biểu mẫu, mở trang xem lại, quay về kiểm tra rồi mở lại.
appId: com.xoicotam.mobile.e2e
name: "M05 - Back navigation preserves the recipient form"
tags:
  - regression
---
- runFlow: ../shared/guest.yaml
- runFlow: ../shared/fill-recipient.yaml
- runFlow: ../shared/review.yaml
# Quay lại từ màn xem đơn không được làm mất thông tin người nhận.
- tapOn:
    id: "workspace-back"
- scrollUntilVisible:
    element:
      id: "recipient-name"
    direction: DOWN
- assertVisible:
    id: "recipient-name"
    text: "Maestro Customer"
- scrollUntilVisible:
    element:
      id: "recipient-phone"
    direction: DOWN
- assertVisible:
    id: "recipient-phone"
    text: "0900000099"
- scrollUntilVisible:
    element:
      id: "recipient-address"
    direction: DOWN
- assertVisible:
    id: "recipient-address"
    text: "12 Nguyen Van Cu, TP HCM"
- runFlow: ../shared/review.yaml
- takeScreenshot: M05-preserved-form
