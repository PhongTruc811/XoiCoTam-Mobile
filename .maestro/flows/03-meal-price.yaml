# Vai trò: Kiểm tra giá đơn sau khi đổi kích cỡ phần xôi.
# Cách hoạt động: Chọn phần 20.000 rồi 30.000 đồng, so sánh tổng tiền ở menu và màn xem lại.
appId: com.xoicotam.mobile.e2e
name: "M03 - Change meal size and preserve the correct review price"
tags:
  - regression
---
- runFlow: ../shared/guest.yaml
- scrollUntilVisible:
    element:
      id: "meal-20000"
    direction: DOWN
- tapOn:
    id: "meal-20000"
# Lựa chọn thứ hai phải thay thế lựa chọn đầu tiên trong toàn bộ đơn.
- scrollUntilVisible:
    element:
      id: "meal-30000"
    direction: DOWN
- tapOn:
    id: "meal-30000"
- runFlow: ../shared/fill-recipient.yaml
- scrollUntilVisible:
    element:
      id: "menu-total"
    direction: DOWN
- assertVisible:
    id: "menu-total"
    text: "30.000 ₫"
- runFlow: ../shared/review.yaml
- scrollUntilVisible:
    element:
      id: "review-price"
    direction: UP
- assertVisible:
    id: "review-price"
    text: "30.000 ₫"
- takeScreenshot: M03-meal-review
