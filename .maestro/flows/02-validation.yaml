# Vai trò: Kiểm tra biểu mẫu người nhận từ chối dữ liệu thiếu hoặc sai.
# Cách hoạt động: Gửi biểu mẫu trống, thử số điện thoại sai rồi kiểm tra các lỗi hiển thị.
appId: com.xoicotam.mobile.e2e
name: "M02 - Reject missing recipient details and an invalid phone"
tags:
  - regression
---
- runFlow: ../shared/guest.yaml
# Gửi biểu mẫu trống trước để kiểm tra từng trường bắt buộc.
- scrollUntilVisible:
    element:
      id: "order-review"
    direction: DOWN
- tapOn:
    id: "order-review"
- scrollUntilVisible:
    element:
      id: "recipient-name-error"
    direction: UP
- assertVisible:
    id: "recipient-name-error"
    text: ".*Bạn hãy nhập tên người nhận.*"
- scrollUntilVisible:
    element:
      id: "recipient-phone-error"
    direction: DOWN
- assertVisible:
    id: "recipient-phone-error"
    text: ".*Nhập số điện thoại hợp lệ.*"
- scrollUntilVisible:
    element:
      id: "recipient-address-error"
    direction: DOWN
- assertVisible:
    id: "recipient-address-error"
    text: ".*Bạn hãy nhập địa chỉ giao hàng.*"
- scrollUntilVisible:
    element:
      id: "recipient-phone"
    direction: UP
- tapOn:
    id: "recipient-phone"
- inputText: "123"
- swipe:
    start: 50%, 60%
    end: 50%, 30%
    duration: 600
# Số điện thoại đã nhập nhưng sai định dạng vẫn phải chặn bước xem lại đơn.
- scrollUntilVisible:
    element:
      id: "order-review"
    direction: DOWN
- tapOn:
    id: "order-review"
- scrollUntilVisible:
    element:
      id: "recipient-phone-error"
    direction: UP
- assertVisible:
    id: "recipient-phone-error"
    text: ".*Nhập số điện thoại hợp lệ.*"
- assertNotVisible:
    id: "review-continue"
- takeScreenshot: M02-invalid-recipient
